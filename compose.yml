services:
  payload:
    image: node:24-alpine
    ports:
      - '3001:3000'
    volumes:
      - payload_build:/home/node/app/.next
      - ./payload:/home/node/app
      - payload_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo
    environment:
      DATABASE_URL: mongodb://mongo/payload
      HOSTNAME: "0.0.0.0"
      PAYLOAD_SECRET: development
  mongo:
    image: mongo:latest
    restart: always
    volumes:
      - ./mongo-data:/data/db
volumes:
  payload_modules:
  payload_build:
